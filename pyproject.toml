[project]
name = "trade-strategy"
version = "0.1.0"
description = "A Flask app for tracking stock and crypto tickers with configurable trade strategy signals."
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11,<2.0",
    "yfinance>=0.2.40,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
